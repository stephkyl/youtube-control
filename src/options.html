<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1 data-i18n="optionsTitle"></h1>
    <fieldset>
      <legend data-i18n="optWatchLegend"></legend>
      <label class="option">
        <input type="radio" name="watchSuggestions" value="fit">
        <span>
          <strong data-i18n="optFitTitle"></strong>
          <small data-i18n="optFitDesc"></small>
        </span>
      </label>
      <label class="option">
        <input type="radio" name="watchSuggestions" value="hide">
        <span>
          <strong data-i18n="optHideTitle"></strong>
          <small data-i18n="optHideDesc"></small>
        </span>
      </label>
    </fieldset>
    <p class="saved" id="saved" aria-live="polite"></p>
  </main>
  <script src="options.js"></script>
</body>
</html>
